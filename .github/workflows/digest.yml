name: daily-digest

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "yamlgraph>=0.5.23" pytest pyyaml
      - run: python -m pytest tests/ -q

  digest:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # yamlgraph from PyPI + the nodes' direct deps only (FR-819 R-2).
      # >=0.5.23 is a hard floor, not a preference: tool slots (FR-892)
      # are absent from every earlier wheel, so the graph's `collect`
      # slot would fail to bind before any node ran.
      - run: pip install "yamlgraph>=0.5.23" feedparser beautifulsoup4 httpx python-dotenv
      - run: python run_digest.py --db digest.db --output digests
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
      - run: |
          git config user.name "digest-bot"
          git config user.email "actions@github.com"
          git add digests/ digest.db README.md
          if git diff --cached --quiet; then
            echo "digest: no-op — no new stories, nothing to commit"
          else
            git commit -m "digest $(date -u +%F)"
            git pull --rebase origin main
            git push
          fi
