version: "1.0"
name: daily_digest_github
description: Daily tech news digest as a markdown bulletin with no email delivery

defaults:
  provider: anthropic
  temperature: 0.5
  prompts_relative: true
  prompts_dir: prompts

state:
  topics: list
  today: str
  max_age_hours: any
  raw_articles: list
  filtered_articles: list
  articles_with_content: list
  analyzed: list
  ranked_stories: list
  digest_markdown: str
  digest_html: str
  digest_status: str
  bulletin_path: any
  sent: any

# Python tools
tools:
  # The pipeline does not name a source (FR-904). The caller supplies one
  # at invocation:
  #   yamlgraph graph run graph.yaml --tool collect=sources/hn_rss.tool.yaml
  # A second digest over a different subject area is a binding and a
  # topics list, not a fork of this repository.
  collect:
    slot: true
    contract:
      runtimes: [python]
      args: [config]

  filter_recent:
    type: python
    module: nodes.filters
    function: filter_recent
    description: "Filter to recent articles, dedupe via SQLite"

  fetch_article_content:
    type: python
    module: nodes.content
    function: fetch_all_content
    description: "Extract text content from all article URLs"

  format_markdown:
    type: python
    module: nodes.formatting
    function: format_markdown
    description: "Render markdown bulletin from ranked stories"

  write_bulletin:
    manifest: tools/write_bulletin.tool.yaml

  send_email:
    manifest: tools/smtp_email.tool.yaml

nodes:
  collect:
    type: python
    tool: collect
    state_key: raw_articles

  filter_recent:
    type: python
    tool: filter_recent
    state_key: filtered_articles

  fetch_content:
    type: python
    tool: fetch_article_content
    state_key: articles_with_content

  analyze_all:
    type: map
    over: "{state.articles_with_content}"
    as: article
    node:
      type: llm
      prompt: analyze_article
      variables:
        title: "{state.article.title}"
        url: "{state.article.url}"
        content: "{state.article.content}"
        topics: "{state.topics}"
    collect: analyzed
    on_error: skip

  rank_stories:
    type: llm
    prompt: rank_stories
    variables:
      analyzed: "{state.analyzed}"
      topics: "{state.topics}"
    state_key: ranked_stories

  format_markdown:
    type: python
    tool: format_markdown
    state_key: digest_markdown

  # Pass-through routing point: the gate edges below read digest_status.
  gate:
    type: passthrough

  write_bulletin:
    type: tool_call
    tool: write_bulletin
    args:
      today: "{state.today}"
      digest_markdown: "{state.digest_markdown}"
    state_key: bulletin_path
    on_error: fail

  send_email:
    type: tool_call
    tool: send_email
    args:
      subject: "Daily Tech Digest — {state.today}"
      text: "{state.digest_markdown}"
      html: "{state.digest_html}"
    state_key: sent
    on_error: fail

edges:
  - from: START
    to: collect
  - from: collect
    to: filter_recent
  - from: filter_recent
    to: fetch_content
  - from: fetch_content
    to: analyze_all
  - from: analyze_all
    to: rank_stories
  - from: rank_stories
    to: format_markdown
  - from: format_markdown
    to: gate
  # Persist before publish: the artifact reaches disk before the network call.
  - from: gate
    to: write_bulletin
    condition: "digest_status == ready"
  - from: gate
    to: END
    condition: "digest_status == no_articles"
  - from: write_bulletin
    to: send_email
  - from: send_email
    to: END
